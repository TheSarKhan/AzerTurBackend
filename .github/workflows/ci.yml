name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_PASSWORD: ci-test-database-only
      OPERATIONS_USER: operations
      OPERATIONS_PASSWORD: ci-test-operations-only-password
      ACCOUNT_LINK_KEY: "Y2ktb25seS1hY2NvdW50LWxpbmstc2VjcmV0LWtleSE="
      PORTAL_ORIGIN: "http://127.0.0.1:4182"
      ALLOW_QA_ACCOUNT_FIXTURES: "1"
      EMAIL_ENABLED: "false"
      DEMO_PAYMENTS_ENABLED: "true"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: azertur
          POSTGRES_USER: azertur
          POSTGRES_PASSWORD: ci-test-database-only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U azertur -d azertur"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B verify
      - name: Verify email cutover without sending email
        env:
          AZERTUR_MAIL_CUTOVER_TEST: "1"
          MAIL_CUTOVER_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/azertur_qa_mail_cutover_ci
        run: |
          python3 - <<'PYTEST'
          import subprocess
          ids=subprocess.check_output(['docker','ps','--filter','ancestor=postgres:17-alpine','--format','{{.ID}}'],text=True).splitlines()
          assert len(ids)==1, 'Expected one CI PostgreSQL service'
          subprocess.run(['docker','exec',ids[0],'psql','-U','azertur','-d','postgres','-v','ON_ERROR_STOP=1','-c','CREATE DATABASE azertur_qa_mail_cutover_ci'],check=True)
          PYTEST
          ./mvnw -B -Dtest=MailCutoverIntegrationTest test
      - name: Start integration API
        run: java -jar target/backend-0.0.1-SNAPSHOT.jar > api.log 2>&1 &
      - name: Wait for API
        run: |
          python3 - <<'PY'
          import time, urllib.request
          for attempt in range(60):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8080/actuator/health',timeout=1) as response:
                      if response.status==200: break
              except Exception: pass
              time.sleep(1)
          else: raise SystemExit('API did not become ready')
          PY
      - name: Verify database, security and customer booking flow
        run: |
          python3 tests/smoke.py
          python3 tests/booking_flow.py
          python3 tests/offer_flow.py
          python3 tests/account_security_flow.py
          python3 tests/amendment_flow.py
          python3 tests/amendment_revision_flow.py
          python3 tests/travel_documents.py
      - name: Show API log on failure
        if: failure()
        run: tail -100 api.log || true

      - name: Verify office roles, allocations, notifications and partner sync
        run: ALLOW_LOCAL_FINANCIAL_FIXTURES=1 python3 tests/office_workflows.py
