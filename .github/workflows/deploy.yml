name: Deploy
# Production deploys only after CI succeeds on main, or manually from the Actions tab.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Component to deploy
        type: choice
        options: [api, mobile-web]
        default: api
      mobile_action:
        description: Inspect infrastructure or deploy the mobile web client
        type: choice
        options: [inspect, deploy, finalize]
        default: inspect
      mobile_ref:
        description: Exact tested mobile-client commit
        type: string
        default: 3f120313293a8dced58208d8007b3781b79ef425
permissions:
  contents: read
concurrency:
  group: deploy-api
  cancel-in-progress: false
jobs:
  deploy:
    if: (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') && inputs.target != 'mobile-web'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      IMAGE: aztrip-api
      SERVICE: api
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: docker/setup-buildx-action@v3
      - name: Build linux/amd64 image
        run: |
          docker buildx build --platform linux/amd64 --load \
            -t "$IMAGE:$SHA" -t "$IMAGE:latest" .
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Ship image to server
        run: |
          docker save "$IMAGE:$SHA" "$IMAGE:latest" | gzip \
            | ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" 'gunzip | docker load'
      - name: Restart service and wait until healthy
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" bash -s -- "$SHA" <<'REMOTE'
          set -euo pipefail
          cd /opt/aztrip
          python3 - "$1" <<'PIN'
          import json,pathlib,sys
          p=pathlib.Path('compose.override.yml')
          if p.exists() and pathlib.Path('mobile-release.json').exists():
              config=json.loads(p.read_text())
              config['services']['api']['image']='aztrip-api:'+sys.argv[1]
              p.write_text(json.dumps(config,indent=2)+'\n');p.chmod(0o600)
          PIN
          docker compose up -d --no-deps api
          for i in $(seq 1 36); do
            if [ "$(docker inspect -f {{.State.Health.Status}} aztrip-api-1)" = healthy ]; then echo "api is healthy"; break; fi
            if [ "$i" = 36 ]; then docker compose logs --tail 60 api; exit 1; fi
            sleep 5
          done
          docker images aztrip-api --format '{{.Repository}}:{{.Tag}}' | grep -v ':latest$' | tail -n +4 | xargs -r docker rmi || true
          REMOTE

  mobile-web:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'mobile-web'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: deploy-mobile-web
      cancel-in-progress: false
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
    steps:
      - name: Configure existing deployment SSH identity
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - uses: actions/checkout@v4
      - name: Inspect Aztrip service topology without printing secrets
        if: inputs.mobile_action == 'inspect'
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" python3 - < deploy/inspect-server.py
      - name: Checkout the pinned customer app
        if: inputs.mobile_action == 'deploy'
        uses: actions/checkout@v4
        with:
          repository: TheSarKhan/AzerTurMobileClient
          ref: ${{ inputs.mobile_ref }}
          path: mobile-client
      - uses: docker/setup-buildx-action@v3
        if: inputs.mobile_action == 'deploy'
      - name: Build tested production images
        if: inputs.mobile_action == 'deploy'
        env:
          MOBILE_SHA: ${{ inputs.mobile_ref }}
        run: |
          [[ "$MOBILE_SHA" =~ ^[0-9a-f]{40}$ ]]
          docker buildx build --platform linux/amd64 --load -t "aztrip-api:$GITHUB_SHA" .
          docker buildx build --platform linux/amd64 --load -t "aztrip-mobile-web:$MOBILE_SHA" mobile-client
      - name: Ship pinned images
        if: inputs.mobile_action == 'deploy'
        env:
          MOBILE_SHA: ${{ inputs.mobile_ref }}
        run: |
          docker save "aztrip-api:$GITHUB_SHA" "aztrip-mobile-web:$MOBILE_SHA" | gzip | ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" 'gunzip | docker load'
          scp -i ~/.ssh/deploy_key deploy/mobile-rollout.py "$SSH_USER@$SSH_HOST:/opt/aztrip/mobile-rollout.py"
      - name: Back up, validate a database clone, and roll out
        if: inputs.mobile_action == 'deploy'
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MOBILE_SHA: ${{ inputs.mobile_ref }}
        run: |
          python3 - <<'PYTHON' | ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" python3 /opt/aztrip/mobile-rollout.py
          import os,json
          assert os.environ['SMTP_PASSWORD'], 'Missing Resend deployment secret'
          print(json.dumps({'backend_sha':os.environ['GITHUB_SHA'],'mobile_sha':os.environ['MOBILE_SHA'],'smtp_password':os.environ['SMTP_PASSWORD']}))
          PYTHON
      - name: Finalize TLS renewal and verify release
        if: inputs.mobile_action == 'finalize'
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" python3 - < deploy/mobile-finalize.py
