name: Deploy
# Production deploys only after CI succeeds on main, or manually from the Actions tab.
# The API deploys right after its own CI. The customer app (web client) lives in another repository,
# so every five minutes this workflow looks at its main branch and ships the newest commit once that
# commit's CI has passed and it is not already live.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Component to deploy
        type: choice
        options: [api, mobile-web]
        default: api
      mobile_action:
        description: Inspect infrastructure or deploy the mobile web client (client-only replaces just the static client and leaves nginx/TLS untouched)
        type: choice
        options: [inspect, deploy, finalize, mobile-only, client-only]
        default: inspect
      mobile_ref:
        description: Exact tested mobile-client commit
        type: string
        default: 3f120313293a8dced58208d8007b3781b79ef425
permissions:
  contents: read
jobs:
  deploy:
    if: (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') && inputs.target != 'mobile-web'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: deploy-api
      cancel-in-progress: false
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      IMAGE: aztrip-api
      SERVICE: api
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: docker/setup-buildx-action@v3
      - name: Build linux/amd64 image
        run: |
          docker buildx build --platform linux/amd64 --load \
            -t "$IMAGE:$SHA" -t "$IMAGE:latest" .
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Ship image to server
        run: |
          docker save "$IMAGE:$SHA" "$IMAGE:latest" | gzip \
            | ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" 'gunzip | docker load'
      - name: Restart service and wait until healthy
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" bash -s -- "$SHA" <<'REMOTE'
          set -euo pipefail
          cd /opt/aztrip
          python3 - "$1" <<'PIN'
          import json,pathlib,sys
          p=pathlib.Path('compose.override.yml')
          if p.exists() and pathlib.Path('mobile-release.json').exists():
              config=json.loads(p.read_text())
              config['services']['api']['image']='aztrip-api:'+sys.argv[1]
              p.write_text(json.dumps(config,indent=2)+'\n');p.chmod(0o600)
          PIN
          docker compose up -d --no-deps api
          for i in $(seq 1 36); do
            if [ "$(docker inspect -f {{.State.Health.Status}} aztrip-api-1)" = healthy ]; then echo "api is healthy"; break; fi
            if [ "$i" = 36 ]; then docker compose logs --tail 60 api; exit 1; fi
            sleep 5
          done
          docker images aztrip-api --format '{{.Repository}}:{{.Tag}}' | grep -v ':latest$' | tail -n +4 | xargs -r docker rmi || true
          REMOTE

  # Looks at the customer app's main branch. Cheap: it only reads GitHub, never the server.
  mobile-check:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
      ready: ${{ steps.pick.outputs.ready }}
    env:
      GH_TOKEN: ${{ github.token }}
      MOBILE_REPO: TheSarKhan/AzerTurMobileClient
    steps:
      - id: pick
        run: |
          sha=$(gh api "repos/$MOBILE_REPO/commits/main" --jq .sha)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          result=$(gh run list -R "$MOBILE_REPO" --workflow ci.yml --commit "$sha" --event push --limit 1 \
            --json status,conclusion \
            --jq '.[0] | if . == null or .status != "completed" then "pending" else .conclusion end')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "$result" = success ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Customer app $sha: CI is '$result', nothing to ship"
          fi

  # Ships the tested customer app commit unless that exact commit is already running.
  mobile-sync:
    needs: mobile-check
    if: needs.mobile-check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: deploy-mobile-web
      cancel-in-progress: false
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      MOBILE_SHA: ${{ needs.mobile-check.outputs.sha }}
    steps:
      - name: Configure existing deployment SSH identity
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Is this client already live?
        id: live
        run: |
          current=$(ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" \
            "grep -o 'aztrip-mobile-web:[0-9a-f]\{40\}' /opt/aztrip/compose.override.yml | head -1 | cut -d: -f2" || true)
          echo "Live client: ${current:-unknown}. Newest tested: $MOBILE_SHA"
          if [ "$current" = "$MOBILE_SHA" ]; then echo "same=true" >> "$GITHUB_OUTPUT"; else echo "same=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.live.outputs.same == 'false'
      - name: Checkout the tested customer app
        if: steps.live.outputs.same == 'false'
        uses: actions/checkout@v4
        with:
          repository: TheSarKhan/AzerTurMobileClient
          ref: ${{ env.MOBILE_SHA }}
          path: mobile-client
      - uses: docker/setup-buildx-action@v3
        if: steps.live.outputs.same == 'false'
      - name: Build the customer app image
        if: steps.live.outputs.same == 'false'
        run: docker buildx build --platform linux/amd64 --load -t "aztrip-mobile-web:$MOBILE_SHA" mobile-client
      - name: Ship it and replace only the static client
        if: steps.live.outputs.same == 'false'
        run: |
          docker save "aztrip-mobile-web:$MOBILE_SHA" | gzip | ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" 'gunzip | docker load'
          scp -i ~/.ssh/deploy_key deploy/mobile-client-update.py "$SSH_USER@$SSH_HOST:/opt/aztrip/mobile-client-update.py"
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" python3 /opt/aztrip/mobile-client-update.py "$MOBILE_SHA"

  mobile-web:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'mobile-web'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: deploy-mobile-web
      cancel-in-progress: false
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
    steps:
      - name: Configure existing deployment SSH identity
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - uses: actions/checkout@v4
      - name: Inspect Aztrip service topology without printing secrets
        if: inputs.mobile_action == 'inspect'
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" python3 - < deploy/inspect-server.py
      - name: Checkout the pinned customer app
        if: inputs.mobile_action == 'deploy' || inputs.mobile_action == 'mobile-only' || inputs.mobile_action == 'client-only'
        uses: actions/checkout@v4
        with:
          repository: TheSarKhan/AzerTurMobileClient
          ref: ${{ inputs.mobile_ref }}
          path: mobile-client
      - uses: docker/setup-buildx-action@v3
        if: inputs.mobile_action == 'deploy' || inputs.mobile_action == 'mobile-only' || inputs.mobile_action == 'client-only'
      - name: Build tested production images
        if: inputs.mobile_action == 'deploy' || inputs.mobile_action == 'mobile-only' || inputs.mobile_action == 'client-only'
        env:
          MOBILE_SHA: ${{ inputs.mobile_ref }}
          MOBILE_ACTION: ${{ inputs.mobile_action }}
        run: |
          [[ "$MOBILE_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [ "$MOBILE_ACTION" = deploy ]; then
            docker buildx build --platform linux/amd64 --load -t "aztrip-api:$GITHUB_SHA" .
          fi
          docker buildx build --platform linux/amd64 --load -t "aztrip-mobile-web:$MOBILE_SHA" mobile-client
      - name: Ship pinned images
        if: inputs.mobile_action == 'deploy' || inputs.mobile_action == 'mobile-only' || inputs.mobile_action == 'client-only'
        env:
          MOBILE_SHA: ${{ inputs.mobile_ref }}
          MOBILE_ACTION: ${{ inputs.mobile_action }}
        run: |
          images=("aztrip-mobile-web:$MOBILE_SHA")
          if [ "$MOBILE_ACTION" = deploy ]; then images+=("aztrip-api:$GITHUB_SHA"); fi
          docker save "${images[@]}" | gzip | ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" 'gunzip | docker load'
          scp -i ~/.ssh/deploy_key deploy/mobile-rollout.py "$SSH_USER@$SSH_HOST:/opt/aztrip/mobile-rollout.py"
      - name: Back up, validate a database clone, and roll out
        if: inputs.mobile_action == 'deploy'
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MOBILE_SHA: ${{ inputs.mobile_ref }}
          MOBILE_ACTION: ${{ inputs.mobile_action }}
        run: |
          python3 - <<'PYTHON' | ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" python3 /opt/aztrip/mobile-rollout.py
          import os,json
          assert os.environ['SMTP_PASSWORD'], 'Missing Resend deployment secret'
          print(json.dumps({'backend_sha':os.environ['GITHUB_SHA'],'mobile_sha':os.environ['MOBILE_SHA'],'smtp_password':os.environ['SMTP_PASSWORD']}))
          PYTHON
      - name: Replace only the static mobile client
        if: inputs.mobile_action == 'mobile-only' || inputs.mobile_action == 'client-only'
        env:
          MOBILE_SHA: ${{ inputs.mobile_ref }}
        run: |
          scp -i ~/.ssh/deploy_key deploy/mobile-client-update.py "$SSH_USER@$SSH_HOST:/opt/aztrip/mobile-client-update.py"
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" python3 /opt/aztrip/mobile-client-update.py "$MOBILE_SHA"
      - name: Finalize TLS renewal and verify release
        if: inputs.mobile_action == 'finalize' || inputs.mobile_action == 'mobile-only'
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" python3 - < deploy/mobile-finalize.py
